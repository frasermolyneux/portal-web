openapi: 3.0.3
info:
  title: Portal forum integration API
  version: 1.0.0
servers:
  - url: https://portal.xtremeidiots.com
security:
  - portalCookie: []
paths:
  /api/integration/v1/server-admin:
    get:
      summary: Server Admin index and authorized Portal action links
      description: Private no-store response; links are Portal-relative and optional links may be null. Uses the existing Server Admin see-all row policy and the destination policies for optional actions.
      responses:
        '200':
          description: Up to 50 agent-enabled servers; missing per-server live status is null.
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [title, gameType, hostname, queryPort, currentPlayers, maxPlayers, currentMap, mod, consoleUrl, chatLogUrl, manageMapsUrl]
                      properties:
                        title:
                          type: string
                        gameType:
                          type: string
                        hostname:
                          type: string
                          nullable: true
                        queryPort:
                          type: integer
                        currentPlayers:
                          type: integer
                          nullable: true
                        maxPlayers:
                          type: integer
                          nullable: true
                        currentMap:
                          type: string
                          nullable: true
                        mod:
                          type: string
                          nullable: true
                        consoleUrl:
                          type: string
                        chatLogUrl:
                          type: string
                          nullable: true
                        manageMapsUrl:
                          type: string
                          nullable: true
        '401':
          description: Sign-in required.
        '403':
          description: Server Admin access denied.
        '503':
          description: Required server or live-status data unavailable.
  /api/integration/v1/session:
    get:
      summary: Portal session, antiforgery token, and shortcut capabilities
      security: []
      responses:
        '200':
          description: Not cacheable. The token is bound to the antiforgery cookie and current session.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  authenticated:
                    type: boolean
                  requestVerificationToken:
                    type: string
                  headerName:
                    type: string
                  capabilities:
                    type: object
                    description: Landing-page access only; all fields are false for guests.
                    required: [players, serverAdmin, chatLogs]
                    properties:
                      players:
                        type: boolean
                        description: Access to /Players (Players.Read).
                      serverAdmin:
                        type: boolean
                        description: Access to /ServerAdmin (GameServers.Admin.Read).
                      chatLogs:
                        type: boolean
                        description: Access to /ServerAdmin/ChatLogIndex (GameServers.Admin.Read and ChatLog.Read).
  /api/integration/v1/player-links/linked-players:
    get:
      summary: Current member's linked game profiles
      description: No-store response. The Portal profile is resolved from the authenticated cookie; no profile identifier is accepted from the caller.
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of the signed-in member's linked and historical player profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items, skip, take]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [connectedPlayerProfileId, playerId, gameType, username, linkMethod, linkedAtUtc, unlinkedAtUtc, isActive]
                      properties:
                        connectedPlayerProfileId:
                          type: string
                          format: uuid
                        playerId:
                          type: string
                          format: uuid
                        gameType:
                          type: string
                        username:
                          type: string
                        linkMethod:
                          type: string
                        linkedAtUtc:
                          type: string
                          format: date-time
                        unlinkedAtUtc:
                          type: string
                          format: date-time
                          nullable: true
                        isActive:
                          type: boolean
                  skip:
                    type: integer
                  take:
                    type: integer
                  totalCount:
                    type: integer
                    nullable: true
                  filteredCount:
                    type: integer
                    nullable: true
        '400':
          description: Invalid pagination.
        '401':
          description: Portal sign-in required.
        '403':
          description: The authenticated Portal account has no active member profile.
        '404':
          description: Portal member profile not found.
        '503':
          description: Repository data unavailable.
  /api/integration/v1/player-links/claims:
    get:
      summary: Pending player link requests for the current member
      responses:
        '200':
          description: No-store response with pending claims and nullable server names.
          content:
            application/json:
              schema:
                type: object
                required: [claims]
                properties:
                  claims:
                    type: array
                    items:
                      type: object
                      required: [claimId, playerId, username, gameType, gameServerId, gameServerName, status, createdAtUtc, expiresAtUtc]
                      properties:
                        claimId: { type: string, format: uuid }
                        playerId: { type: string, format: uuid }
                        username: { type: string }
                        gameType: { type: string }
                        gameServerId: { type: string, format: uuid }
                        gameServerName: { type: string, nullable: true }
                        status: { type: string, enum: [Pending] }
                        createdAtUtc: { type: string, format: date-time }
                        expiresAtUtc: { type: string, format: date-time }
        '401': { description: Portal sign-in required. }
        '403': { description: No active authenticated member profile. }
        '404': { description: Portal profile not found. }
        '503': { description: Repository data unavailable. }
  /api/integration/v1/player-links/claim-code:
    post:
      summary: Issue an approval-only player link code
      description: Requires the token and cookie obtained from the session endpoint; expires after one hour.
      parameters:
        - $ref: '#/components/parameters/Antiforgery'
      responses:
        '200':
          description: No-store code response.
          content:
            application/json:
              schema:
                type: object
                required: [code, activatedAtUtc, expiresAtUtc]
                properties:
                  code: { type: string }
                  activatedAtUtc: { type: string, format: date-time }
                  expiresAtUtc: { type: string, format: date-time }
        '400': { description: Missing or invalid antiforgery token. }
        '401': { description: Portal sign-in required. }
        '403': { description: No active authenticated member profile. }
        '404': { description: Portal profile not found. }
        '503': { description: Repository data unavailable. }
  /api/integration/v1/player-links/claims/{claimId}/approve:
    post:
      summary: Approve an owned player claim
      parameters:
        - { in: path, name: claimId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Antiforgery'
      responses:
        '204': { description: Claim approved. }
        '400': { description: Missing or invalid antiforgery token. }
        '401': { description: Portal sign-in required. }
        '403': { description: No active authenticated member profile. }
        '404': { description: Profile or owned claim not found. }
        '409': { description: Expired or conflicting claim. }
        '503': { description: Repository data unavailable. }
  /api/integration/v1/player-links/claims/{claimId}/decline:
    post:
      summary: Decline an owned player claim
      parameters:
        - { in: path, name: claimId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Antiforgery'
      responses:
        '204': { description: Claim declined. }
        '400': { description: Missing or invalid antiforgery token. }
        '401': { description: Portal sign-in required. }
        '403': { description: No active authenticated member profile. }
        '404': { description: Profile or owned claim not found. }
        '409': { description: Expired or conflicting claim. }
        '503': { description: Repository data unavailable. }
  /api/integration/v1/player-links/linked-players/{connectedPlayerProfileId}:
    delete:
      summary: Unlink an owned player profile
      parameters:
        - { in: path, name: connectedPlayerProfileId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Antiforgery'
      responses:
        '204': { description: Player profile unlinked. }
        '400': { description: Missing or invalid antiforgery token. }
        '401': { description: Portal sign-in required. }
        '403': { description: No active authenticated member profile. }
        '404': { description: Profile or owned player link not found. }
        '503': { description: Repository data unavailable. }
  /api/integration/v1/player-map:
    get:
      summary: Live and recent player locations for public servers
      security:
        - {}
        - portalCookie: []
      responses:
        '200':
          description: No-store response. Guests receive individual Repository coordinates; named observations require game-scoped Players.Read. Render markers from points only to avoid duplicating players.
          content:
            application/json:
              schema:
                type: object
                required: [asOfUtc, recentSinceUtc, points, players]
                properties:
                  asOfUtc:
                    type: string
                    format: date-time
                  recentSinceUtc:
                    type: string
                    format: date-time
                  points:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/PlayerMapLocation'
                        - type: object
                          required: [count]
                          properties:
                            count:
                              type: integer
                              description: Always 1 per observation; not a unique-person count.
                  players:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/PlayerMapLocation'
                        - type: object
                          required: [name]
                          properties:
                            name:
                              type: string
        '503':
          description: A required map dependency is unavailable.
  /api/integration/v1/banners:
    get:
      summary: Configured public server banners
      security: []
      responses:
        '200':
          description: Administrator-configured HTML banners in server-list order.
          content:
            application/json:
              schema:
                type: object
                required: [banners]
                properties:
                  banners:
                    type: array
                    items:
                      type: string
  /api/integration/v1/rotations:
    get:
      summary: Public server rotations
      security: []
      description: An observed-history fallback is identified by isObservedHistory; it is not a configured rotation.
      responses:
        '200':
          description: Public server rotations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        gameServerId:
                          type: string
                          format: uuid
                        title:
                          type: string
                        gameType:
                          type: string
                        rotationTitle:
                          type: string
                          nullable: true
                        isObservedHistory:
                          type: boolean
                        maps:
                          type: array
                          items:
                            type: object
                            properties:
                              mapId:
                                type: string
                                format: uuid
                                nullable: true
                              mapName:
                                type: string
                              mapImageUri:
                                type: string
                                nullable: true
                              likes:
                                type: integer
                              dislikes:
                                type: integer
                              votes:
                                type: integer
                              approval:
                                type: number
                                format: double
                              serverLikes:
                                type: integer
                                nullable: true
                              serverDislikes:
                                type: integer
                                nullable: true
                              serverVotes:
                                type: integer
                                nullable: true
                              serverApproval:
                                type: number
                                format: double
                                nullable: true
  /api/integration/v1/maps:
    get:
      summary: Search the public map catalogue
      security: []
      parameters:
        - in: query
          name: gameType
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of public map metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPage'
        '400':
          description: Invalid paging or game type.
        '503':
          description: Catalogue unavailable.
  /api/integration/v1/moderation:
    get:
      summary: Paged moderation actions
      description: Requires the Portal AdminActions.Read policy.
      security:
        - portalCookie: []
      parameters:
        - in: query
          name: gameType
          schema:
            type: string
        - in: query
          name: skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Moderation actions in descending creation order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationPage'
        '400':
          description: Invalid paging or game type.
        '401':
          description: Portal sign-in required.
        '403':
          description: Portal authorization denied.
        '503':
          description: Moderation data unavailable.
  /api/integration/v1/stats:
    get:
      summary: Aggregate Portal statistics
      description: Requires Dashboard.Read. Counts refer to tracked game-player records, not distinct people.
      security:
        - portalCookie: []
      responses:
        '200':
          description: Counts from current dependency snapshots.
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOfUtc:
                    type: string
                    format: date-time
                  playersOnline:
                    type: integer
                  onlineByGame:
                    type: array
                    items:
                      type: object
                      properties:
                        gameType:
                          type: string
                        playersOnline:
                          type: integer
                  trackedPlayers:
                    type: integer
                  activePlayers24h:
                    type: integer
                  activePlayers48h:
                    type: integer
                  unclaimedBans:
                    type: integer
                  openReports:
                    type: integer
                  actions24h:
                    type: object
                    nullable: true
                    properties:
                      bans:
                        type: integer
                      tempBans:
                        type: integer
                      kicks:
                        type: integer
                      warnings:
                        type: integer
                      observations:
                        type: integer
        '401':
          description: Portal sign-in required.
        '403':
          description: Portal authorization denied.
        '503':
          description: Statistics unavailable.
  /api/integration/v1/activity:
    get:
      summary: Paged Portal activity log
      description: Requires Users.ActivityLog.
      security:
        - portalCookie: []
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            enum: [1, 6, 12, 24, 168, 720]
            default: 24
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Newest activity entries first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          description: Invalid filter or paging.
        '401':
          description: Portal sign-in required.
        '403':
          description: Portal authorization denied.
  /api/integration/v1/downloads/collection:
    get:
      summary: Browse map or mod collections
      security: []
      parameters:
        - in: query
          name: game
          required: true
          schema:
            type: string
        - in: query
          name: kind
          schema:
            type: string
            default: maps
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: version
          schema:
            type: string
      responses:
        '200':
          description: Version-pinned collection page.
  /api/integration/v1/downloads/browse:
    get:
      summary: Browse a download path
      security: []
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: version
          schema:
            type: string
      responses:
        '200':
          description: Version-pinned directory page.
  /api/integration/v1/downloads/manifest:
    get:
      summary: Retrieve a map manifest
      security: []
      parameters:
        - in: query
          name: game
          required: true
          schema:
            type: string
        - in: query
          name: mapName
          required: true
          schema:
            type: string
        - in: query
          name: version
          schema:
            type: string
      responses:
        '200':
          description: Version-pinned manifest.
  /api/integration/v1/downloads/archives:
    post:
      summary: Create a ZIP archive from folders
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/Antiforgery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
      responses:
        '200':
          description: Archive job; polling is required until complete.
        '400':
          description: Invalid request or antiforgery token.
        '401':
          description: Portal sign-in required.
  /api/integration/v1/downloads/rotation-archives:
    post:
      summary: Create a ZIP from a public server rotation
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/Antiforgery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameServerId]
              properties:
                gameServerId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Archive job.
        '400':
          description: Invalid request or antiforgery token.
        '401':
          description: Portal sign-in required.
  /api/integration/v1/downloads/archive-status:
    get:
      summary: Retrieve an owned archive job
      security:
        - portalCookie: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archive job.
        '401':
          description: Portal sign-in required.
  /api/integration/v1/downloads/grants:
    post:
      summary: Create an individual-file or owned-archive download grant
      description: File grants may be anonymous; archive grants require a Portal session.
      security: []
      parameters:
        - $ref: '#/components/parameters/Antiforgery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  nullable: true
                version:
                  type: string
                  nullable: true
                archiveId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Short-lived download grant; do not log or persist the URL.
        '400':
          description: Invalid request or antiforgery token.
        '401':
          description: Portal sign-in required for archive grants.
components:
  parameters:
    Antiforgery:
      in: header
      name: RequestVerificationToken
      required: true
      schema:
        type: string
  securitySchemes:
    portalCookie:
      type: apiKey
      in: cookie
      name: XIPortal
  schemas:
    PlayerMapLocation:
      type: object
      required: [lat, lng, gameType, activity]
      properties:
        lat:
          type: number
          format: double
          description: Repository latitude of the individual observation.
        lng:
          type: number
          format: double
          description: Repository longitude of the individual observation.
        gameType:
          type: string
        activity:
          type: string
          enum: [live, recentlySeen]
          description: Recently seen does not imply offline.
    ActivityPage:
      type: object
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              eventName:
                type: string
              category:
                type: string
              actorId:
                type: string
                nullable: true
              actorName:
                type: string
                nullable: true
              sourceComponent:
                type: string
                nullable: true
              action:
                type: string
                nullable: true
              properties:
                type: object
                additionalProperties:
                  type: string
        skip:
          type: integer
        take:
          type: integer
        totalCount:
          type: integer
        filteredCount:
          type: integer
    MapPage:
      type: object
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, gameType, name]
            properties:
              id:
                type: string
                format: uuid
              gameType:
                type: string
              name:
                type: string
              imageUrl:
                type: string
                nullable: true
        skip:
          type: integer
        take:
          type: integer
        totalCount:
          type: integer
          nullable: true
        filteredCount:
          type: integer
          nullable: true
    ModerationPage:
      type: object
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              createdUtc:
                type: string
                format: date-time
              gameType:
                type: string
                nullable: true
              type:
                type: string
              playerName:
                type: string
                nullable: true
              playerId:
                type: string
                format: uuid
              actionUrl:
                type: string
                nullable: true
                description: Portal-relative action edit route, present only for users with access to that action.
              adminName:
                type: string
                nullable: true
              source:
                type: string
        skip:
          type: integer
        take:
          type: integer
        totalCount:
          type: integer
          nullable: true
        filteredCount:
          type: integer
          nullable: true
