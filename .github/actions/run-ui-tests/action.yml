name: Run portal integration tests
description: Compatibility action that builds and runs the HTTP integration and browser suites.

runs:
  using: composite
  steps:
    - name: Run HTTP integration and browser tests
      shell: pwsh
      run: pwsh -NoProfile -File scripts/run-tests.ps1 -Suite Integration -Configuration Release

    - name: Upload integration and bootstrap results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results-XtremeIdiots.Portal.Web.IntegrationTests
        path: |
          src/TestResults/HttpIntegration/**/*.trx
          src/TestResults/Browser/**/*.trx
          src/TestResults/bootstrap/**/*.trx
        retention-days: 7
        if-no-files-found: error
