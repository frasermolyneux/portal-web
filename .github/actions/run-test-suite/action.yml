name: Run portal test suite
description: Build and run one validated test suite using the repository test runner.

inputs:
  suite:
    description: Test suite to run (Unit, HttpIntegration, or Browser).
    required: true

outputs:
  report:
    description: Bounded schema-1 JSON for this suite, without test names or failure output.
    value: ${{ steps.report.outputs.report }}
  bootstrap:
    description: Separate bootstrap smoke report for Browser runs (not included in suite counts).
    value: ${{ steps.bootstrap-report.outputs.report }}

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.suite }} tests
      id: tests
      shell: pwsh
      env:
        TEST_SUITE: ${{ inputs.suite }}
      run: |
        $coverage = $env:TEST_SUITE -in @('Unit', 'HttpIntegration')
        ./scripts/run-tests.ps1 -Suite $env:TEST_SUITE -Configuration Release -Measure -Coverage:$coverage

    - name: Upload ${{ inputs.suite }} results
      id: artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results-${{ inputs.suite }}
        path: |
          src/TestResults/${{ inputs.suite }}/**/*.trx
          src/TestResults/${{ inputs.suite }}/**/measurement.json
          src/TestResults/${{ inputs.suite }}/**/discovery.txt
          src/TestResults/${{ inputs.suite }}/**/coverage.cobertura.xml
          src/TestResults/${{ inputs.suite }}/**/Sequence*.xml
          src/TestResults/${{ inputs.suite }}/**/diagnostics/**
          ${{ inputs.suite == 'Browser' && 'src/TestResults/bootstrap/**/*.trx' || '' }}
          ${{ inputs.suite == 'Browser' && 'src/TestResults/bootstrap/**/Sequence*.xml' || '' }}
          ${{ inputs.suite == 'Browser' && 'src/TestResults/bootstrap/**/diagnostics/**' || '' }}
        retention-days: 7
        if-no-files-found: error

    - name: Summarize ${{ inputs.suite }} tests
      id: report
      if: always()
      shell: pwsh
      env:
        TEST_SUITE: ${{ inputs.suite }}
        TEST_OUTCOME: ${{ steps.tests.outcome }}
        ARTIFACT_ID: ${{ steps.artifacts.outputs.artifact-id }}
      run: ./scripts/report-test-results.ps1 -Suite $env:TEST_SUITE -RunOutcome $env:TEST_OUTCOME -ArtifactId $env:ARTIFACT_ID -RequireMeasurements:($env:TEST_OUTCOME -ne 'skipped')

    - name: Summarize bootstrap smoke separately
      id: bootstrap-report
      if: always() && inputs.suite == 'Browser'
      shell: pwsh
      env:
        ARTIFACT_ID: ${{ steps.artifacts.outputs.artifact-id }}
      run: ./scripts/report-test-results.ps1 -Suite bootstrap -ArtifactId $env:ARTIFACT_ID
