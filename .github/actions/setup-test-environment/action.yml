name: Set up portal test dependencies
description: Resolve repository runtimes, cache dependencies and install locked frontend packages before the CI build.

outputs:
  dotnet-version:
    description: SDK selected by global.json.
    value: ${{ steps.setup.outputs.dotnet-version }}

runs:
  using: composite
  steps:
    - uses: frasermolyneux/actions/dotnet-node-setup@dotnet-node-setup/v1
      id: setup
      with:
        npm-cache-dependency-path: src/XtremeIdiots.Portal.Web/package-lock.json

    - name: Prepare test dependencies
      shell: pwsh
      run: ./scripts/setup-test-environment.ps1 -Phase Dependencies
