name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-test-environment/**
      - scripts/setup-test-environment.ps1
      - scripts/test-support.ps1
      - scripts/browser.runsettings
      - scripts/report-test-results.ps1
      - global.json
      - .node-version
      - src/**/*.csproj
      - src/XtremeIdiots.Portal.Web/package.json
      - src/XtremeIdiots.Portal.Web/package-lock.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-test-environment/**
      - scripts/setup-test-environment.ps1
      - scripts/test-support.ps1
      - scripts/browser.runsettings
      - scripts/report-test-results.ps1
      - global.json
      - .node-version
      - src/**/*.csproj
      - src/XtremeIdiots.Portal.Web/package.json
      - src/XtremeIdiots.Portal.Web/package-lock.json

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-test-environment

      - name: Build the solution
        shell: pwsh
        run: |
          dotnet build src/XtremeIdiots.Portal.Web.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release solution build failed.' }

      - name: Install Chromium and verify the environment
        id: bootstrap
        shell: pwsh
        run: ./scripts/setup-test-environment.ps1 -Phase Browser

      - name: Upload bootstrap test results
        id: bootstrap-artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: copilot-bootstrap-results
          path: |
            src/TestResults/bootstrap/**/*.trx
            src/TestResults/bootstrap/**/Sequence*.xml
            src/TestResults/bootstrap/**/diagnostics/**
          retention-days: 7
          if-no-files-found: warn

      - name: Summarize bootstrap environment verification
        if: always()
        shell: pwsh
        env:
          TEST_OUTCOME: ${{ steps.bootstrap.outcome }}
          ARTIFACT_ID: ${{ steps.bootstrap-artifacts.outputs.artifact-id }}
        run: ./scripts/report-test-results.ps1 -Suite bootstrap -RunOutcome $env:TEST_OUTCOME -ArtifactId $env:ARTIFACT_ID
