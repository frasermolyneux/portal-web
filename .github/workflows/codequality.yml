name: Code Quality

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
      actions: read
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: frasermolyneux/actions/.github/workflows/codequality.yml@a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8 # codequality/v1.0.0
    with:
      sonar-project-key: frasermolyneux_portal-web
      sonar-organization: frasermolyneux
      sonar-host-url: https://sonarcloud.io
      build-target: dotnet-web-ci
      skip-format-check: true
      dotnet-project: XtremeIdiots.Portal.Web
      dotnet-version: 10.0.402
      src-folder: src
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  devops-secure-scanning:
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: frasermolyneux/actions/.github/workflows/devops-secure-scanning.yml@a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8 # devops-secure-scanning/v1.0.0

  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          comment-summary-in-pr: always
